services:
  - type: web
    name: inkthreadhub-wa-alert
    runtime: node
    plan: free
    region: singapore
    rootDir: whatsapp-alert-server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: API_KEY
        sync: false
      - key: SENDER_NUMBER
        sync: false
      - key: ALERT_TO
        value: "919194115127"
